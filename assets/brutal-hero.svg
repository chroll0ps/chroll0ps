<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <style>
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(6px); }
    }
    @keyframes pulseDot {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0.2; }
    }
    @keyframes signalRun {
      0%   { transform: translateX(0px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(700px); opacity: 0; }
    }
    @keyframes coreShift {
      0%, 24%  { fill: #FFE600; }
      25%, 49% { fill: #00F0FF; }
      50%, 74% { fill: #B8FF00; }
      75%, 99% { fill: #FF5E7E; }
      100%     { fill: #FFE600; }
    }
    .orbit  { transform-origin: 95px 80px; animation: spinCW 14s linear infinite; }
    .core   { animation: coreShift 10s linear infinite; }
    .c1     { animation: floatA 3.2s ease-in-out infinite; }
    .c2     { animation: floatB 3.2s ease-in-out infinite 0.4s; }
    .c3     { animation: floatA 3.2s ease-in-out infinite 0.8s; }
    .led    { animation: pulseDot 1.3s steps(1) infinite; }
    .signal { animation: signalRun 3.4s linear infinite; }
    .title  { font-family: 'Space Grotesk', 'Arial Black', Impact, sans-serif; font-weight: 900; letter-spacing: 2px; }
    .mono   { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-weight: 800; }
  </style>

  <!-- Connecting Spine + Gliding Signal Pulse -->
  <line x1="95" y1="80" x2="815" y2="80" stroke="#000000" stroke-width="4" />
  <circle class="signal" cx="95" cy="80" r="6" fill="#FFE600" stroke="#000000" stroke-width="2.5" />

  <!-- ==================== LEFT: ORBITAL CORE CIRCLE ==================== -->
  <g class="orbit">
    <circle cx="95" cy="80" r="64" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="14 8 4 8" />
    <circle cx="95" cy="16" r="7" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <circle cx="95" cy="144" r="7" fill="#FF5E7E" stroke="#000000" stroke-width="2.5" />
  </g>

  <circle cx="101" cy="86" r="46" fill="#000000" />
  <circle class="core" cx="95" cy="80" r="46" stroke="#000000" stroke-width="4" />
  <circle cx="95" cy="80" r="28" fill="#0D0D0D" stroke="#000000" stroke-width="3" />
  <text x="95" y="86" text-anchor="middle" class="title" font-size="19" fill="#FFFFFF">AE</text>

  <!-- ==================== CENTER: ROUNDED IDENTITY PILL ==================== -->
  <rect x="196" y="38" width="424" height="92" rx="46" fill="#000000" />
  <rect x="190" y="32" width="424" height="92" rx="46" fill="#0D0D0D" stroke="#000000" stroke-width="4" />

  <!-- Chromatic Name -->
  <text x="404" y="75" text-anchor="middle" class="title" font-size="29" fill="#00F0FF">ANAS ENNADIF</text>
  <text x="401" y="72" text-anchor="middle" class="title" font-size="29" fill="#FFFFFF">ANAS ENNADIF</text>

  <!-- Role Subtitle -->
  <text x="402" y="100" text-anchor="middle" class="mono" font-size="11.5" fill="#FFE600" letter-spacing="1.2">CLOUD DATA + AI ENGINEER </text>

  <!-- Floating Handle Pill -->
  <rect x="466" y="16" width="124" height="24" rx="12" fill="#000000" />
  <rect x="463" y="13" width="124" height="24" rx="12" fill="#B8FF00" stroke="#000000" stroke-width="3" />
  <circle class="led" cx="477" cy="25" r="3.5" fill="#0D0D0D" />
  <text x="530" y="29" text-anchor="middle" class="mono" font-size="11" fill="#000000">@CHROLL0PS</text>

  <!-- ==================== RIGHT: 3 FLOATING DOMAIN CIRCLES ==================== -->
  <g class="c1">
    <circle cx="685" cy="85" r="30" fill="#000000" />
    <circle cx="680" cy="80" r="30" fill="#00F0FF" stroke="#000000" stroke-width="3.5" />
    <text x="680" y="85" text-anchor="middle" class="mono" font-size="13" fill="#000000">AI</text>
  </g>

  <g class="c2">
    <circle cx="753" cy="85" r="30" fill="#000000" />
    <circle cx="748" cy="80" r="30" fill="#B8FF00" stroke="#000000" stroke-width="3.5" />
    <text x="748" y="85" text-anchor="middle" class="mono" font-size="12" fill="#000000">DATA</text>
  </g>

  <g class="c3">
    <circle cx="821" cy="85" r="30" fill="#000000" />
    <circle cx="816" cy="80" r="30" fill="#FF5E7E" stroke="#000000" stroke-width="3.5" />
    <text x="816" y="85" text-anchor="middle" class="mono" font-size="12" fill="#000000">DEV</text>
  </g>
</svg>
